[package]
name = "shenbi"
version = "1.0.0"
edition = "2021"
description = "Multi-provider image generation MCP server with a local configuration UI"
license = "MIT"

[[bin]]
name = "shenbi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
image = { version = "0.25", features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "fs", "time", "sync", "net"] }

[profile.release]
opt-level = "s"
lto = true
